<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TBA Command & Control Centre - DRDO PoC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      --bg-dark: #091015; --panel-bg: #121E26; --border-color: #2A3F54;
      --text-main: #E2E8EC; --text-muted: #8B9CAE;
      --accent-blue: #00E5FF; --accent-green: #00E676; --accent-red: #FF3D00; --accent-orange: #FF9100;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-main); }
    #root { display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #05090C; border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    header h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: 1px; color: var(--accent-blue); text-transform: uppercase; }
    header .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 2px;}
    
    .conn-badge { font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid currentColor;}
    .conn-on { color: var(--accent-green); background: rgba(0, 230, 118, 0.1); }
    .conn-off { color: var(--accent-red); background: rgba(255, 61, 0, 0.1); }

    .main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; border-right: 1px solid var(--border-color); background: #0b141a; }
    
    .sidebar { width: 450px; background: var(--panel-bg); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
    
    .drone-card { border-bottom: 1px solid var(--border-color); padding: 16px; }
    .id-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .drone-id { font-weight: 700; font-size: 16px; color: #fff; }
    
    .tags-container { display: flex; gap: 6px; }
    .badge { font-size: 9px; font-weight: 700; padding: 3px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid currentColor;}
    .badge-aes { color: var(--accent-green); background: rgba(0, 230, 118, 0.05); }
    .badge-tethered { color: #B388FF; background: rgba(179, 136, 255, 0.1); }
    .badge-mobile { color: var(--accent-blue); background: rgba(0, 229, 255, 0.1); }
    
    .video-container { width: 100%; height: 160px; background: #000; border: 1px solid #333; position: relative; margin-bottom: 12px; border-radius: 4px; overflow: hidden; }
    .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px); pointer-events: none; }
    .ai-box { position: absolute; border: 1.5px solid var(--accent-red); width: 40px; height: 40px; top: 40%; left: 45%; background: rgba(255, 61, 0, 0.1); display: flex; justify-content: center; align-items: flex-end; }
    .ai-label { background: var(--accent-red); color: white; font-size: 8px; font-weight: bold; padding: 1px 4px; position: absolute; bottom: -12px; white-space: nowrap; }
    .cam-status { position: absolute; top: 8px; left: 8px; color: var(--accent-red); font-size: 10px; font-weight: bold; display: flex; align-items: center; gap: 4px;}
    .rec-dot { width: 6px; height: 6px; background: var(--accent-red); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 12px; }
    .stat-label { color: var(--text-muted); text-transform: uppercase; font-size: 10px;}
    .stat-value { font-family: monospace; font-size: 13px; color: var(--accent-blue); }
    
    .battery-bar { height: 4px; background: #2A3F54; margin-top: 10px; overflow: hidden; }
    .battery-fill { height: 100%; transition: width 0.4s; }
    .bat-ok { background: var(--accent-green); }
    .bat-warn { background: var(--accent-orange); }
    .bat-critical { background: var(--accent-red); }
    
    .cmd-row { display: flex; gap: 8px; margin-top: 14px; }
    .cmd-btn { flex: 1; font-size: 11px; font-weight: 600; padding: 8px 0; text-transform: uppercase; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer; transition: all 0.2s; border-radius: 2px; }
    .cmd-btn:hover { background: rgba(255,255,255,0.1); }
    .cmd-btn.rtl { border-color: rgba(255, 61, 0, 0.5); color: var(--accent-red); }
    .cmd-btn.rtl:hover { background: rgba(255, 61, 0, 0.1); }
    .cmd-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .leaflet-container { background: #091015; }
    .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    
    .drone-marker-label { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; white-space: nowrap; background: rgba(0,0,0,0.8); border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 2px 6px; border-radius: 2px; }
    .home-marker-label { 
      position: absolute; 
      bottom: 26px; /* Moved from 'top' to 'bottom' to float above the icon */
      left: 50%; 
      transform: translateX(-50%); 
      font-size: 9px; 
      font-weight: 700; 
      white-space: nowrap; 
      background: rgba(0,0,0,0.85); /* Tactical dark background */
      padding: 2px 6px; 
      border-radius: 2px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script>
  const { useState, useEffect, useRef, useCallback } = React;
  const h = React.createElement;
  const BACKEND_HTTP = "http://localhost:8000";
  const BACKEND_WS = "ws://localhost:8000/ws/telemetry";

  function DroneCard({ drone, onCommand }) {
    const isReturning = drone.flight_mode === "RETURNING_TO_LAUNCH";
    const isTethered = drone.drone_type.includes("Tethered");
    
    return h("div", { className: "drone-card" },
      h("div", { className: "id-row" },
        h("div", { className: "drone-id" }, drone.drone_id),
        h("div", { className: "tags-container" },
          h("span", { className: "badge badge-aes" }, drone.encryption_status || "AES-256"),
          h("span", { className: `badge ${isTethered ? 'badge-tethered' : 'badge-mobile'}` }, drone.drone_type)
        )
      ),
      
      h("div", { className: "video-container" },
        h("div", { className: "cam-status" }, h("div", { className: "rec-dot" }), "LIVE FEED EO/IR"),
        h("div", { className: "video-overlay" }),
        h("div", { className: "ai-box", style: { animation: 'blink 2s infinite' } },
            h("div", { className: "ai-label" }, "OBJ DETECTED: PERSONNEL 98%")
        )
      ),

      h("div", { className: "stat-grid" },
        h("div", null, h("div", { className: "stat-label" }, "Coordinates"), h("div", { className: "stat-value" }, `${drone.lat.toFixed(5)}, ${drone.lon.toFixed(5)}`)),
        h("div", null, h("div", { className: "stat-label" }, "Altitude (ASL)"), h("div", { className: "stat-value" }, `${drone.alt_m.toFixed(1)} m`)),
        h("div", null, h("div", { className: "stat-label" }, "Velocity"), h("div", { className: "stat-value" }, drone.speed_mps != null ? drone.speed_mps.toFixed(1) + " m/s" : "0.0 m/s")),
        h("div", null, h("div", { className: "stat-label" }, "Protocol"), h("div", { className: "stat-value" }, drone.protocol.toUpperCase())),
        h("div", null, h("div", { className: "stat-label" }, "Flight Mode"), h("div", { className: "stat-value", style: {color: "#fff"} }, drone.flight_mode.replace(/_/g, " ")))
      ),
      
      h("div", { className: "battery-bar" },
        h("div", {
          className: `battery-fill ${drone.battery_status === 'critical' ? 'bat-critical' : drone.battery_status === 'warn' ? 'bat-warn' : 'bat-ok'}`,
          style: { width: `${drone.battery_pct ?? 0}%` },
        })
      ),

      h("div", { className: "cmd-row" },
        h("button", { className: "cmd-btn", onClick: () => onCommand(drone.drone_id, "GOTO", { lat: drone.lat + 0.002, lon: drone.lon, alt_m: 60 }) }, "Task Waypoint"),
        h("button", { className: "cmd-btn rtl", disabled: isReturning, onClick: () => onCommand(drone.drone_id, "RTL", {}) }, isReturning ? "RTL Active" : "Execute RTL")
      )
    );
  }

  function App() {
    const [drones, setDrones] = useState({});
    const [connected, setConnected] = useState(false);
    const mapRef = useRef(null);
    const markersRef = useRef({});
    const homeMarkersRef = useRef({});
    const homeLinesRef = useRef({});
    const wsRef = useRef(null);

    useEffect(() => {
      const map = L.map("map", {zoomControl: false}).setView([12.955, 77.61], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
      mapRef.current = map;
      return () => map.remove();
    }, []);

    const upsertMarker = useCallback((drone) => {
      const map = mapRef.current;
      if (!map) return;
      
      const isTethered = drone.drone_type.includes("Tethered");
      const color = isTethered ? "#B388FF" : "#00E5FF";

      // Drone Marker
      const svgIcon = `
        <div style="transform: rotate(${drone.heading_deg || 0}deg); width:30px; height:30px; display:flex; align-items:center; justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <line x1="16" y1="16" x2="6" y2="6" stroke="${color}" stroke-width="2" />
            <line x1="16" y1="16" x2="26" y2="6" stroke="${color}" stroke-width="2" />
            <line x1="16" y1="16" x2="6" y2="26" stroke="${color}" stroke-width="2" />
            <line x1="16" y1="16" x2="26" y2="26" stroke="${color}" stroke-width="2" />
            <circle cx="16" cy="16" r="5" fill="${color}"/>
            <polygon points="16,2 12,10 20,10" fill="${color}"/>
          </svg>
        </div>
        <div class="drone-marker-label" style="border-color:${color}; color:${color}">${drone.drone_id}</div>
      `;

      if (markersRef.current[drone.drone_id]) {
        markersRef.current[drone.drone_id].setLatLng([drone.lat, drone.lon]);
        markersRef.current[drone.drone_id].setIcon(
          L.divIcon({ className: "", html: svgIcon, iconSize: [30, 30], iconAnchor: [15, 15] })
        );
      } else {
        const icon = L.divIcon({ className: "", html: svgIcon, iconSize: [30, 30], iconAnchor: [15, 15] });
        markersRef.current[drone.drone_id] = L.marker([drone.lat, drone.lon], { icon }).addTo(map);
      }

      // Restored: Home / Launch Marker
      if (drone.home_lat != null && drone.home_lon != null && !homeMarkersRef.current[drone.drone_id]) {
        const homeSvg = `
          <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="11" fill="transparent" stroke="${color}" stroke-width="2"/>
            <path d="M12 5 L19 11 V19 H14 V14 H10 V19 H5 V11 Z" fill="${color}"/>
          </svg>
          <div class="home-marker-label" style="border: 1px dashed ${color}; color: ${color};">BASE</div>
        `;
        const homeIcon = L.divIcon({ className: "", html: homeSvg, iconSize: [22, 22], iconAnchor: [11, 11] });
        homeMarkersRef.current[drone.drone_id] = L.marker([drone.home_lat, drone.home_lon], { icon: homeIcon, zIndexOffset: -100 }).addTo(map);
      }

      // Restored: Active Path to Base
      if (drone.home_lat != null && drone.home_lon != null) {
        const latlngs = [[drone.lat, drone.lon], [drone.home_lat, drone.home_lon]];
        if (homeLinesRef.current[drone.drone_id]) {
          homeLinesRef.current[drone.drone_id].setLatLngs(latlngs);
        } else {
          homeLinesRef.current[drone.drone_id] = L.polyline(latlngs, {
            color, weight: 1.5, opacity: 0.3, dashArray: "4 6"
          }).addTo(map);
        }
      }
    }, []);

    useEffect(() => {
      let retryTimer;
      function connect() {
        const ws = new WebSocket(BACKEND_WS);
        wsRef.current = ws;
        ws.onopen = () => setConnected(true);
        ws.onclose = () => { setConnected(false); retryTimer = setTimeout(connect, 2000); };
        ws.onmessage = (evt) => {
          const msg = JSON.parse(evt.data);
          if (msg.type === "state_update") {
            setDrones((prev) => ({ ...prev, [msg.data.drone_id]: msg.data }));
            upsertMarker(msg.data);
          }
        };
      }
      connect();
      return () => { clearTimeout(retryTimer); wsRef.current?.close(); };
    }, [upsertMarker]);

    const sendCommand = useCallback(async (droneId, command, params) => {
      try {
        await fetch(`${BACKEND_HTTP}/api/drones/${droneId}/command`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ command, params }),
        });
      } catch (e) { console.error("Command failed", e); }
    }, []);

    const droneList = Object.values(drones).sort((a, b) => a.drone_id.localeCompare(b.drone_id));

    return h(React.Fragment, null,
      h("header", null,
        h("div", null,
          h("h1", null, "Tactical Battle Area (TBA) Command Centre"),
          h("div", { className: "sub" }, "Integrated Drone Management System • Multi-Platform C2 Ecosystem")
        ),
        h("span", { className: `conn-badge ${connected ? "conn-on" : "conn-off"}` }, connected ? "SECURE UPLINK ACTIVE" : "DATALINK OFFLINE")
      ),
      h("div", { className: "main" },
        h("div", { id: "map" }),
        h("div", { className: "sidebar" },
          droneList.map((d) => h(DroneCard, { key: d.drone_id, drone: d, onCommand: sendCommand }))
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
